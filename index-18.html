/* --- Supplied animation concepts, art-directed for Elahi --- */
.depth-stage{position:relative;height:570px;margin-top:2px;perspective:1400px;overflow:visible}
.depth-carousel{position:relative;width:100%;height:100%;display:grid;place-items:center;isolation:isolate}

function initDepthCarousel(){
  const root=document.getElementById('homeDepthCarousel'); if(!root) return;
  const cards=[...root.querySelectorAll('.depth-card')]; if(!cards.length) return;
  const dots=document.getElementById('homeDepthDots'); let active=0,timer=null;
  const slots=[
    {x:-330,z:-240,rot:-10,scale:.72,op:.18,blur:6},{x:-215,z:-150,rot:-7,scale:.83,op:.54,blur:3},
    {x:0,z:0,rot:0,scale:1,op:1,blur:0},{x:215,z:-150,rot:7,scale:.83,op:.54,blur:3},{x:330,z:-240,rot:10,scale:.72,op:.18,blur:6}
  ];
  const mod=(n,m)=>(n%m+m)%m;
  cards.forEach((_,i)=>{if(!dots)return;const d=document.createElement('span');d.className='depth-dot'+(i===0?' active':'');d.onclick=()=>{active=i;render();restart()};dots.appendChild(d)});
  function render(){cards.forEach((card,i)=>{const delta=mod(i-active,cards.length);const logical=delta<=Math.floor(cards.length/2)?delta:delta-cards.length;const slot=slots[Math.max(-2,Math.min(2,logical))+2];card.style.transform=`translate3d(calc(-50% + ${slot.x}px),0,${slot.z}px) rotateY(${slot.rot}deg) scale(${slot.scale})`;card.style.opacity=slot.op;card.style.filter=`blur(${slot.blur}px)`;card.style.zIndex=20-Math.abs(logical);card.classList.toggle('is-center',logical===0);card.setAttribute('aria-hidden',logical===0?'false':'true')});if(dots)[...dots.children].forEach((d,i)=>d.classList.toggle('active',i===active))}
  function next(){active=mod(active+1,cards.length);render();restart()} function prev(){active=mod(active-1,cards.length);render();restart()}
  root.querySelector('[data-depth-next]')?.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();next()});
  root.querySelector('[data-depth-prev]')?.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();prev()});
  cards.forEach((card,i)=>card.addEventListener('click',e=>{if(i!==active){e.preventDefault();active=i;render();restart()}}));
  root.addEventListener('mouseenter',()=>timer&&clearInterval(timer));root.addEventListener('mouseleave',restart);
  function restart(){clearInterval(timer);timer=setInterval(next,4200)} render();restart();
}
function initGooeyNav(){
  const nav=document.getElementById('gooeyNav'); if(!nav)return;
  const particles=document.getElementById('gooeyParticles');const items=[...nav.querySelectorAll('[data-gooey-filter]')];const cards=[...document.querySelectorAll('#projectArchive .project-card')];
  for(let i=0;i<15;i++){const p=document.createElement('span');p.className='gooey-particle';p.dataset.i=i;particles?.appendChild(p)}
  function burst(){nav.classList.add('is-animating');[...(particles?.children||[])].forEach((p,i)=>{const a=(Math.PI*2*i)/15,r=24+Math.random()*42;p.style.left='50%';p.style.top='50%';p.style.transform=`translate(${Math.cos(a)*r}px,${Math.sin(a)*r*.48}px)`});setTimeout(()=>[...(particles?.children||[])].forEach(p=>{p.style.opacity='0';p.style.transform='translate(0,0)'}),650);setTimeout(()=>nav.classList.remove('is-animating'),680)}
  items.forEach(b=>b.addEventListener('click',()=>{const f=b.dataset.gooeyFilter;items.forEach(x=>x.classList.toggle('active',x===b));cards.forEach(c=>c.style.display=(f==='all'||c.dataset.category===f)?'block':'none');burst()}));
}
function initPageAnimations(){initDepthCarousel();initGooeyNav();}

// SpecularButton-inspired light tracking for primary actions.
(function(){
  const buttons=[...document.querySelectorAll('.specular-btn')];
  buttons.forEach(btn=>{
    btn.addEventListener('pointermove', e=>{
      const r=btn.getBoundingClientRect();
      const x=((e.clientX-r.left)/r.width)*100;
      const y=((e.clientY-r.top)/r.height)*100;
      btn.style.setProperty('--sx',x+'%');
      btn.style.setProperty('--sy',y+'%');
      btn.style.setProperty('--shine','1');
    });
    btn.addEventListener('pointerenter',()=>btn.style.setProperty('--shine','1'));
    btn.addEventListener('pointerleave',()=>{
      btn.style.setProperty('--sx','50%');btn.style.setProperty('--sy','50%');btn.style.setProperty('--shine','.62');
    });
  });
})();

/* ===== INTERACTION ENHANCEMENTS ===== */
(function(){
  let lastY=window.scrollY, ticking=false;
  function updateScroll(){
    const y=window.scrollY;
    const navEl=document.getElementById('nav');
    if(navEl){
      navEl.classList.toggle('scrolled',y>40);
      if(y>lastY && y>180) navEl.classList.add('nav-hide');
      else navEl.classList.remove('nav-hide');
    }
    const h=document.documentElement;
    const pct=h.scrollTop/(Math.max(1,h.scrollHeight-h.clientHeight))*100;
    const progress=document.getElementById('progress'); if(progress) progress.style.width=pct+'%';
    document.querySelectorAll('.parallax').forEach(el=>{
      const r=el.getBoundingClientRect();
      if(r.bottom>-100 && r.top<innerHeight+100){const y2=(r.top-innerHeight/2)*-0.028;el.style.transform=`scale(1.045) translate3d(0,${y2}px,0)`}
    });
    lastY=y; ticking=false;
  }
  window.addEventListener('scroll',()=>{if(!ticking){requestAnimationFrame(updateScroll);ticking=true}},{passive:true});

  function setupTextReveal(){
    document.querySelectorAll('h1,h2,h3').forEach(el=>{
      if(el.closest('.nav,.service-body,.project-content,.footer,.lightbox')) return;
      if(el.dataset.textReady) return;
      const raw=el.textContent.trim(); if(!raw || raw.length>95) return;
      el.dataset.textReady='1'; el.dataset.textReveal='1';
      const words=raw.split(/(\s+)/).map(t=>/\s+/.test(t)?t:`<span class="word">${t}</span>`).join('');
      el.innerHTML=words;
    });
  }
  function stagger(){
    document.querySelectorAll('.reveal').forEach((el,i)=>{if(!el.dataset.delay)el.dataset.delay=String(Math.min(3,i%4))});
  }
  const obs=new MutationObserver(()=>{setupTextReveal();stagger()});
  obs.observe(document.getElementById('app'),{childList:true,subtree:true});
  setupTextReveal();stagger();

  function bindTilt(){
    document.querySelectorAll('.project-card,.service-card,.xyz-card,.feature,.about-card').forEach(card=>{
      if(card.dataset.tiltBound) return; card.dataset.tiltBound='1';
      card.addEventListener('pointermove',e=>{
        if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        const r=card.getBoundingClientRect(), x=(e.clientX-r.left)/r.width-.5, y=(e.clientY-r.top)/r.height-.5;
        const max=card.classList.contains('project-card')?3.2:2.2;
        card.style.transform=`perspective(1100px) rotateX(${(-y*max).toFixed(2)}deg) rotateY(${(x*max).toFixed(2)}deg) translateY(-4px)`;
      });
      card.addEventListener('pointerleave',()=>{card.style.transform=''});
    });
  }
  const mo2=new MutationObserver(bindTilt); mo2.observe(document.getElementById('app'),{childList:true,subtree:true}); bindTilt();

  document.addEventListener('click',e=>{
    const a=e.target.closest('a[href^="#"]');
    if(!a || a.dataset.route || a.getAttribute('href')==='#') return;
    const id=a.getAttribute('href').slice(1), el=document.getElementById(id);
    if(el){e.preventDefault();el.scrollIntoView({behavior:'smooth',block:'start'})}
  });

  document.addEventListener('keydown',e=>{
    if(e.key==='Escape') document.getElementById('lightbox')?.classList.remove('open');
  });
})();
</script>
